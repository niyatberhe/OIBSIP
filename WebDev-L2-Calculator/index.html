<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="A premium, modern, glassmorphic web calculator that performs sequential arithmetic operations with decimal and backspace support.">
  <title>Web Calculator - Modern Design</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="calc-container" id="calculator-app">
    <header class="calc-header">
      <span class="calc-logo">WEB CALCULATOR</span>
      <div class="calc-indicators">
        <span class="indicator-dot"></span>
        <span class="indicator-dot"></span>
        <span class="indicator-dot"></span>
      </div>
    </header>

    <section class="calc-display" aria-label="Calculator display screen">
      <div class="display-history" id="display-history" aria-live="polite"></div>
      <div class="display-output" id="display-output" aria-live="polite">0</div>
    </section>

    <section class="calc-grid" aria-label="Calculator buttons">
      <button class="btn btn-action" id="btn-clear" aria-label="Clear all">C</button>
      <button class="btn btn-action" id="btn-backspace" aria-label="Backspace">⌫</button>
      <button class="btn btn-action" id="btn-toggle-sign" aria-label="Toggle sign">+/-</button>
      <button class="btn btn-operator" id="btn-divide" data-operator="÷" aria-label="Divide">÷</button>

      <button class="btn btn-digit" data-digit="7">7</button>
      <button class="btn btn-digit" data-digit="8">8</button>
      <button class="btn btn-digit" data-digit="9">9</button>
      <button class="btn btn-operator" id="btn-multiply" data-operator="×" aria-label="Multiply">×</button>

      <button class="btn btn-digit" data-digit="4">4</button>
      <button class="btn btn-digit" data-digit="5">5</button>
      <button class="btn btn-digit" data-digit="6">6</button>
      <button class="btn btn-operator" id="btn-subtract" data-operator="−" aria-label="Subtract">−</button>

      <button class="btn btn-digit" data-digit="1">1</button>
      <button class="btn btn-digit" data-digit="2">2</button>
      <button class="btn btn-digit" data-digit="3">3</button>
      <button class="btn btn-operator" id="btn-add" data-operator="+" aria-label="Add">+</button>

      <button class="btn btn-digit" data-digit="0">0</button>
      <button class="btn btn-digit" id="btn-decimal" data-digit=".">.</button>
      <button class="btn btn-equals" id="btn-equals" aria-label="Equals">=</button>
    </section>
  </main>

  <footer class="calc-footer">
    <p>Press keys on your keyboard or tap buttons to calculate.</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
